apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapsemeet-gateway
  labels:
    app: synapsemeet-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapsemeet-gateway
  template:
    metadata:
      labels:
        app: synapsemeet-gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/PROJECT_ID/synapsemeet-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: synapsemeet-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: synapsemeet-gateway
spec:
  selector:
    app: synapsemeet-gateway
  ports:
    - port: 80
      targetPort: 4000
  type: LoadBalancer  # Needs external IP for WebSocket
