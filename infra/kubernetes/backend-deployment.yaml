apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapsemeet-backend
  labels:
    app: synapsemeet-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapsemeet-backend
  template:
    metadata:
      labels:
        app: synapsemeet-backend
    spec:
      containers:
        - name: backend
          image: gcr.io/PROJECT_ID/synapsemeet-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: synapsemeet-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: synapsemeet-backend
spec:
  selector:
    app: synapsemeet-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
