version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: synapsemeet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synapsemeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: synapsemeet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ───────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: synapsemeet_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data

  # ─── FastAPI Backend ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsemeet_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ───────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsemeet_celery
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Node.js WebSocket Gateway ───────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: synapsemeet_gateway
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - ./gateway/src:/app/src
    depends_on:
      - redis
      - backend

  # ─── Next.js Frontend ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapsemeet_frontend
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
      - gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:4000

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
